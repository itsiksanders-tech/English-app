<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7e8">
<title>למדים אנגלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Rubik:wght@500;600;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div id="userBar" class="user-bar hidden">
      <span id="userGreeting" class="user-greeting"></span>
      <span id="userLevelBadge" class="level-badge"></span>
      <button id="logoutBtn" class="logout-btn" type="button" aria-label="התנתקות">⎋</button>
    </div>
    <div id="gameStats" class="game-stats hidden">
      <div class="stat">
        <span class="stat-emoji">⭐</span>
        <span id="score">0</span>
      </div>
      <div class="stat streak">
        <span class="stat-emoji">🔥</span>
        <span id="streak">0</span>
      </div>
    </div>
  </header>

  <main id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">התחברות</button>
        <button id="tabSignup" class="auth-tab" type="button">משתמש חדש</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>שם
          <input id="loginName" type="text" autocomplete="off" required>
        </label>
        <label>סיסמה
          <input id="loginPassword" type="password" autocomplete="off" required>
        </label>
        <button type="submit" class="auth-submit">התחבר</button>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <label>שם
          <input id="signupName" type="text" autocomplete="off" required>
        </label>
        <label>גיל
          <input id="signupAge" type="number" min="3" max="14" required>
        </label>
        <label>סיסמה
          <input id="signupPassword" type="password" autocomplete="off" minlength="6" required>
        </label>
        <label>אימות סיסמה
          <input id="signupConfirm" type="password" autocomplete="off" minlength="6" required>
        </label>
        <p class="auth-hint">הסיסמה חייבת לפחות 6 תווים</p>
        <button type="submit" class="auth-submit">צור משתמש</button>
      </form>

      <div id="authError" class="auth-error"></div>
      <div id="authLoading" class="auth-loading hidden">טוען...</div>
    </div>
  </main>

  <main id="game" class="game hidden">
    <div class="word-card">
      <div id="prompt" class="prompt"></div>
    </div>

    <div id="options" class="options"></div>

    <div id="feedback" class="feedback" aria-live="polite"></div>
  </main>

  <div id="celebration" class="celebration hidden">
    <div id="confettiLayer"></div>
    <div class="celebration-emoji">🏆</div>
    <div class="celebration-text">כל הכבוד!</div>
    <div id="celebrationScore" class="celebration-score">10 מתוך 10</div>
    <button id="playAgainBtn" class="play-again-btn">לשחק עוד</button>
  </div>

</div>

<script src="words.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
