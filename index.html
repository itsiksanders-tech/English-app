<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff7e8">
<title>למדים אנגלית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Rubik:wght@500;600;700;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="stat">
      <span class="stat-emoji">⭐</span>
      <span id="score">0</span>
    </div>
    <div class="stat streak">
      <span class="stat-emoji">🔥</span>
      <span id="streak">0</span>
    </div>
  </header>

  <main id="game" class="game">
    <div class="word-card">
      <div id="prompt" class="prompt"></div>
    </div>

    <div id="options" class="options"></div>

    <div id="feedback" class="feedback" aria-live="polite"></div>
  </main>

  <div id="celebration" class="celebration hidden">
    <div id="confettiLayer"></div>
    <div class="celebration-emoji">🏆</div>
    <div class="celebration-text">כל הכבוד!</div>
    <div id="celebrationScore" class="celebration-score">10 מתוך 10</div>
    <button id="playAgainBtn" class="play-again-btn">לשחק עוד</button>
  </div>

</div>

<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
